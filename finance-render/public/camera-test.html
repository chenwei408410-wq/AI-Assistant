<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机扫码实测</title><link rel="stylesheet" href="/finance.css"></head><body><div class="login" style="margin:20px auto;max-width:650px"><h1>手机摄像头与条码实测 · 优化版</h1><p>请在手机Safari或Chrome中打开本页。相机画面只在本机处理，不上传，也不读取公司财务数据。</p><div class="toolbar"><button class="primary" id="start">打开后置摄像头</button><button id="stop">关闭相机</button></div><p id="status" role="status">尚未启动</p><video id="video" playsinline muted style="width:100%;max-height:360px;background:#132e28;border-radius:8px"></video><div class="notice">把商品条码横向对准镜头，让条码占画面宽度约一半到三分之二，保持清晰，避免贴得太近或强反光。浏览器无原生条码识别时，使用EAN-13/EAN-8本地识别；其他码制可能需要扫码枪或手工输入。</div><label>相机识别结果<input id="result" readonly style="width:100%;margin-top:8px" placeholder="尚未识别条码"></label><p id="decoder" class="muted"></p><button id="copy">复制测试结果</button><pre id="report" style="white-space:pre-wrap;font-size:12px"></pre><p><a href="/login">返回工作台登录</a>　<a href="/auth/bootstrap">首次设置管理员</a></p></div><script src="/scanner.js" defer></script><script src="/camera-test.js" defer></script></body></html>
