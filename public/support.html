<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>知音 · 售货机客服 / Hỗ trợ máy bán hàng</title><link rel="stylesheet" href="/customer-service.css"></head>
<body><div class="shell"><header><div class="brand" aria-label="售货机客服">知<span>知音 · SERVICE</span></div><div class="langs" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="vi" aria-pressed="false">Tiếng Việt</button></div></header>
<main><section class="intro"><span class="eyebrow">HERE TO HELP</span><h1 id="title"></h1><p id="subtitle"></p></section><section class="agent"><img src="/secretary.png" alt="AI 虚拟客服形象" onerror="this.style.display='none'"><div class="agent-copy"><strong id="agentName"></strong><span id="status"></span></div><span class="dot"></span></section>
<div class="demo" id="demo" role="note"></div><div class="machine"><span id="machineLabel"></span><strong id="machineValue"></strong><button id="restart" type="button"></button></div>
<section class="conversation" aria-label="Customer service conversation"><div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div><div id="options" class="options"></div><section id="quick" hidden></section><section id="review" hidden></section></section>
</main><footer><form id="composer"><label class="sr-only" for="answer" id="inputLabel"></label><textarea id="answer" rows="1" maxlength="1200"></textarea><button class="send" id="send" type="submit" aria-label="发送">↑</button></form><p class="privacy" id="privacy"></p><div class="bottom"><span id="progress"></span><button id="human" type="button"></button></div><p id="notice" role="status"></p></footer></div><script type="module" src="/customer-service-production.js"></script></body></html>
