services:
  - type: web
    name: company-finance-test
    runtime: node
    plan: free
    region: singapore
    branch: finance-render
    rootDir: finance-render
    buildCommand: npm install --omit=dev && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: OWNER_EMAIL
        sync: false
      - key: ORG_CONFIG
        sync: false
      - key: BOOTSTRAP_CODE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: company-finance-test-db
          property: connectionString
databases:
  - name: company-finance-test-db
    plan: free
    region: singapore
    ipAllowList: []
