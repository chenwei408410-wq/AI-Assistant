<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>售后工作台</title><link rel="stylesheet" href="/support-admin.css"></head><body><header><div><span class="eyebrow">SERVICE DESK</span><h1>售后工作台 <small>Hỗ trợ sau bán hàng</small></h1></div><div id="identity">正在验证客服账号…</div></header><main><div id="message" role="status"></div><section id="workspace" hidden><form id="filters" class="filters"><label>提交日期起（北京时间）<input type="date" name="from"></label><label>提交日期止<input type="date" name="to"></label><label>设备编号<input name="machine" maxlength="40" placeholder="全部设备"></label><label>处理状态<select name="status"><option value="">全部</option></select></label><label>币种<select name="currency"><option value="">分别汇总</option><option>VND</option><option>CNY</option></select></label><button>筛选</button><button type="button" id="export">下载核对报表</button></form><div id="totals" class="totals"></div><div class="layout"><section class="list"><div id="list"></div><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section><section id="detail" class="detail"><div class="empty">选择一条售后记录，查看客户资料、凭证及处理进度。</div></section></div></section></main><script type="module" src="/support-admin.js"></script></body></html>
