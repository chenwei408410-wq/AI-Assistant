name = "zhiyin-ai-assistant"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-13"

# Customer-service persistence (D1 created in the selected Cloudflare account).
[[d1_databases]]
binding = "SUPPORT_DB"
database_name = "zhiyin-support-prod"
database_id = "b7f4f3f1-553e-47e7-9c60-21269cec5a06"
migrations_dir = "migrations"

# Create this PRIVATE bucket after enabling R2; never enable public r2.dev access.
[[r2_buckets]]
binding = "SUPPORT_FILES"
bucket_name = "zhiyin-support-files"
